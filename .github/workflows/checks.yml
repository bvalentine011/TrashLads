# Runs the tests and builds on every pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix functions && npm ci --prefix web
      - run: npm --prefix functions run typecheck && npm --prefix functions test
      - run: npm --prefix web run typecheck && npm --prefix web run build:demo
